<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 메뉴 추천</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>오늘의 메뉴 추천</h1>
      <p class="hero-text">날씨와 기분, 음식 종류, 예산에 맞는 오늘의 메뉴를 추천해드려요.</p>
    </header>

    <section id="home-view" class="card home-card">
      <form id="prefs-form">
        <div class="field-group">
          <label for="weather">날씨</label>
          <select name="weather" id="weather" required>
            <option value="clear">맑음</option>
            <option value="hot">더움</option>
            <option value="cloudy">흐림</option>
            <option value="cool">선선함</option>
            <option value="rainy">비</option>
            <option value="snow">눈</option>
            <option value="cold">추움</option>
          </select>
        </div>

        <div class="field-group">
          <label for="mood">기분</label>
          <select name="mood" id="mood" required>
            <option value="stressed">스트레스</option>
            <option value="relaxed">편안</option>
            <option value="happy">행복</option>
            <option value="tired">피곤함</option>
          </select>
        </div>

        <div class="field-group">
          <label for="type">음식 종류</label>
          <select name="type" id="type" required>
            <option value="any">상관없음</option>
            <option value="korean">한식</option>
            <option value="chinese">중식</option>
            <option value="japanese">일식</option>
            <option value="western">양식</option>
            <option value="snack_asian">분식/아시안</option>
          </select>
        </div>

        <div class="field-group">
          <label for="budget">예산</label>
          <select name="budget" id="budget" required>
            <option value="under_10k">1만원 이하</option>
            <option value="10k_30k">1만원 초과 3만원 이하</option>
            <option value="over_30k">3만원 초과</option>
          </select>
        </div>

        <button type="submit" class="primary-btn" id="recommend-btn">추천 받기</button>
      </form>
    </section>

    <section id="result-view" class="hidden">
      <div id="result-message" class="result-message hidden"></div>
      <div id="result-card" class="card"></div>
      <div class="actions">
        <button type="button" class="primary-btn" id="reroll-btn">재추천</button>
        <button type="button" class="secondary-btn" id="home-btn">홈</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
